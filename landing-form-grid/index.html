<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Hello</title>
  </head>
  <body>
    <div class="box1">
      <div class="header">
        <div class="titleNavContainer">
          <h3 class="specsH3">Company</h3>
          <nav class="navbar-header specsA">
            <ul>
              <li><a href="#">Services</a></li>
              <li><a href="#">News</a></li>
              <li><a href="#">Docs</a></li>
              <li><a href="#">About Us</a></li>
            </ul>
          </nav>
        </div>

        <div class="search-bar">
          <input
            type="text"
            placeholder="SEARCH"
            maxlength="20"
            class="search-input"
          />
          <img src="icons/search_icon.svg" class="search-icon" />
        </div>
      </div>
    </div>

    <div class="main-overlay">
      <div class="main-content">
        <div class="content-grid">
          <div class="l-column">
            <h1 class="specsH1">REQUEST YOUR DEMO</h1>
            <p>
              Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
              eiusmod tempor incididunt ut labore et dolore magna aliqua.
            </p>

            <div class="buttons">
              <a class="btn primary-btn" href="#">LOREM IPSUM</a>
              <a class="btn secondary-btn" href="#">Details</a>
            </div>

            <div class="icon-group">
              <img src="icons/trophy-svg.svg" alt="Icon 1" />
              <img src="icons/share-svg.svg" alt="Icon 2" />
              <img src="icons/personal-svgrepo.svg" alt="Icon 3" />
              <img src="icons/the-internet-svg.svg" alt="Icon 4" />
            </div>
          </div>

          <div class="r-column">
            <form class="overflow-form" id="testForm">
              <h3>IT'S QUICK & EASY</h3>
              <div class="form-group">
                <label>FIRST NAME</label>
                <input type="text" />
              </div>
              <div class="form-group">
                <label>LAST NAME</label>
                <input type="text" />
              </div>
              <div class="form-group">
                <label>EMAIL</label>
                <input type="text" />
              </div>
              <div class="form-group">
                <label>MESSAGE (OPTIONAL)</label>
                <textarea></textarea>
              </div>
              <button type="submit">SUBMIT</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="box2"></div>
    <script src="script.js"></script>
  </body>
</html>
